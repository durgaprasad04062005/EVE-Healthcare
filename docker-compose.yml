# ---------------------------------------------------------------------------
# EVE Healthcare — docker-compose.yml
#
# Services:
#   db  — PostgreSQL 16 database
#   api — FastAPI application
#
# Usage:
#   docker-compose up --build        # build and start everything
#   docker-compose up -d             # run in background
#   docker-compose down              # stop and remove containers
#   docker-compose down -v           # also remove the db volume (wipes data)
# ---------------------------------------------------------------------------

version: "3.9"

services:

  # -------------------------------------------------------------------------
  # PostgreSQL database
  # -------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: eve_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eve_password}
      POSTGRES_DB: ${POSTGRES_DB:-eve_healthcare}
    volumes:
      # Named volume persists database data between container restarts
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Expose to host for local debugging (e.g. DBeaver, psql)
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eve} -d ${POSTGRES_DB:-eve_healthcare}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------------
  # FastAPI application
  # -------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eve_api
    environment:
      # Reads from .env file if present; otherwise uses the defaults here
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-eve}:${POSTGRES_PASSWORD:-eve_password}@db:5432/${POSTGRES_DB:-eve_healthcare}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_in_production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy  # wait for postgres to be ready
    # Run Alembic migrations, then start the API server.
    # Using 'sh -c' so we can chain commands.
    command: >
      sh -c "
        echo 'Running database migrations...' &&
        python -m alembic upgrade head &&
        echo 'Starting API server...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    volumes:
      # Mount source code for development hot-reload (remove in production)
      - .:/app
    restart: unless-stopped

volumes:
  postgres_data:
